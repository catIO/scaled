<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function() {
      var darkIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cg fill='%23ffffff'%3E%3Crect x='80' y='300' width='88' height='176' rx='14'/%3E%3Crect x='212' y='168' width='88' height='308' rx='14'/%3E%3Crect x='344' y='36' width='88' height='440' rx='14'/%3E%3C/g%3E%3C/svg%3E";
      var lightIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cg fill='%23000000'%3E%3Crect x='80' y='300' width='88' height='176' rx='14'/%3E%3Crect x='212' y='168' width='88' height='308' rx='14'/%3E%3Crect x='344' y='36' width='88' height='440' rx='14'/%3E%3C/g%3E%3C/svg%3E";

      var matcher = window.matchMedia('(prefers-color-scheme: dark)');
      function updateFavicon() {
        var link = document.getElementById('favicon');
        if (!link) {
          link = document.createElement('link');
          link.id = 'favicon';
          link.rel = 'icon';
          link.type = 'image/svg+xml';
          document.head.appendChild(link);
        }
        link.href = matcher.matches ? darkIcon : lightIcon;
      }
      try {
        matcher.addEventListener('change', updateFavicon);
      } catch (e) {
        try { matcher.addListener(updateFavicon); } catch (err) {}
      }
      updateFavicon();
    })();
  </script>
  <link rel="apple-touch-icon" href="/icon-512.png?v=4" />
  <title>Scaled</title>
  <meta name="description" content="Scaled - Scalse Practice App" />
  <meta name="author" content="Catherina" />

  <!-- TODO: Update og:title to match your application name -->
  <meta property="og:title" content="Scaled" />
  <meta property="og:description" content="Scaled - Music Practice App" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
</head>

</html>
